<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南関東4競馬場 過去5走データ分析</title>
    <style>
        :root {
            --primary-color: #115c32; /* 競馬場をイメージした深い緑 */
            --accent-color: #d4af37;  /* 金色のアクセント */
            --bg-color: #f8f9fa;
            --text-color: #333;
            --table-header-bg: #1e3d2f;
        }
        body {
            font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 100%; /* 5走表示のために幅を最大に広げる */
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
            font-size: 24px;
            margin-top: 0;
        }
        .info-bar {
            background-color: #e9ecef;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .table-container {
            overflow-x: auto; /* スマホや画面の狭いPCでの横スクロール対策 */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px; /* 文字サイズを少し小さくして見やすく */
            min-width: 1400px; /* 5走分の列を確保するため最低横幅を広げる */
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 8px 6px;
            text-align: center;
        }
        th {
            background-color: var(--table-header-bg);
            color: #fff;
            font-weight: bold;
        }
        th.sub-header {
            background-color: #2c523f;
        }
        tr:nth-child(even) {
            background-color: #f1f3f5;
        }
        tr:hover {
            background-color: #e2e6ea;
        }
        
        /* 過去5走の列ごとの背景色（見やすさのための色分け） */
        .bg-run1 { background-color: #fff9db; } /* 黄 */
        .bg-run2 { background-color: #f3f0ff; } /* 紫 */
        .bg-run3 { background-color: #e3fafc; } /* 青 */
        .bg-run4 { background-color: #ebfbee; } /* 緑 */
        .bg-run5 { background-color: #fff5f5; } /* 赤 */
        
        .bold { font-weight: bold; }
        .loading {
            text-align: center;
            padding: 20px 0;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🐴 南関東4競馬場 データ分析ダッシュボード（過去5走完全版）</h1>
    <div class="info-bar">
        Pythonによる自動スクレイピングデータ。過去5走の「前半速度」「後半速度」「ペース指数」をすべて表示しています。
    </div>

    <div id="loading-text" class="loading">データを読み込み中...</div>

    <div class="table-container">
        <table id="keiba-table" style="display: none;">
            <thead>
                <tr>
                    <th rowspan="2" style="width: 40px;">馬番</th>
                    <th rowspan="2" style="width: 140px;">馬名</th>
                    <th rowspan="2" style="width: 80px;">騎手</th>
                    <th colspan="4" class="bg-run1">前走（1走前）</th>
                    <th colspan="4" class="bg-run2">2走前</th>
                    <th colspan="4" class="bg-run3">3走前</th>
                    <th colspan="4" class="bg-run4">4走前</th>
                    <th colspan="4" class="bg-run5">5走前</th>
                </tr>
                <tr>
                    <th class="sub-header bg-run1">距離/馬場</th>
                    <th class="sub-header bg-run1">タイム</th>
                    <th class="sub-header bg-run1">前半/後半</th>
                    <th class="sub-header bg-run1">ペース</th>
                    <th class="sub-header bg-run2">距離/馬場</th>
                    <th class="sub-header bg-run2">タイム</th>
                    <th class="sub-header bg-run2">前半/後半</th>
                    <th class="sub-header bg-run2">ペース</th>
                    <th class="sub-header bg-run3">距離/馬場</th>
                    <th class="sub-header bg-run3">タイム</th>
                    <th class="sub-header bg-run3">前半/後半</th>
                    <th class="sub-header bg-run3">ペース</th>
                    <th class="sub-header bg-run4">距離/馬場</th>
                    <th class="sub-header bg-run4">タイム</th>
                    <th class="sub-header bg-run4">前半/後半</th>
                    <th class="sub-header bg-run4">ペース</th>
                    <th class="sub-header bg-run5">距離/馬場</th>
                    <th class="sub-header bg-run5">タイム</th>
                    <th class="sub-header bg-run5">前半/後半</th>
                    <th class="sub-header bg-run5">ペース</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<script>
    fetch('keiba_data.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('JSONファイルの読み込みに失敗しました。');
            }
            return response.json();
        })
        .then(data => {
            const tbody = document.querySelector('#keiba-table tbody');
            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('keiba-table').style.display = 'table';

            data.forEach(horse => {
                const tr = document.createElement('tr');

                // 馬の基本情報
                let html = `
                    <td class="bold">${horse['馬番'] || '-'}</td>
                    <td class="bold" style="text-align: left; color: #115c32;">${horse['馬名'] || '-'}</td>
                    <td>${horse['騎手'] || '-'}</td>
                `;

                // ★命令を拡張：ループの上限を「5」に変更
                for (let i = 1; i <= 5; i++) {
                    const dist = horse[`過去${i}_距離`] ? horse[`過去${i}_距離`] + 'm' : '-';
                    const track = horse[`過去${i}_馬場`] || '-';
                    const time = horse[`過去${i}_タイム`] || '-';
                    
                    const front = horse[`過去${i}_前半速度`] ? horse[`過去${i}_前半速度`].toFixed(2) : '-';
                    const late = horse[`過去${i}_後半速度`] ? horse[`過去${i}_後半速度`].toFixed(2) : '-';
                    const pace = horse[`過去${i}_ペース指数`] ? horse[`過去${i}_ペース指数`].toFixed(3) : '-';

                    html += `
                        <td class="bg-run${i}">${dist}<br><small>(${track})</small></td>
                        <td class="bg-run${i}">${time}</td>
                        <td class="bg-run${i}">${front} /<br>${late}</td>
                        <td class="bg-run${i} bold" style="color: #b25000;">${pace}</td>
                    `;
                }

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        })
        .catch(error => {
            document.getElementById('loading-text').innerText = 'エラー: ' + error.message;
            console.error(error);
        });
</script>

</body>
</html>
